name: Backend keepalive
# Supabase free-tier projects pause after ~7 days without API activity.
# This ping counts as activity and keeps auth + sync + leaderboards alive even
# through weeks when nobody plays. Runs twice a week; manual trigger available.
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hwkgjsijsjzvtjgjkhpm.supabase.co/rest/v1/scores?select=uid&limit=1" \
            -H "apikey: sb_publishable_1DuqcLyB0b-gcpdaxZJe_A_RZISUxbV")
          echo "REST responded HTTP $code"
          # 200 = alive; anything else fails the run so the repo owner sees it
          test "$code" = "200"
