<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="description" content="LinguaDrive — משחק ללימוד אנגלית וספרדית בעברית: שיעורים קוליים, ספריית מילים, חזרות חכמות, אתגר יומי וטבלאות שיאים. חינם.">
<meta property="og:title" content="LinguaDrive 🚗 לומדים אנגלית וספרדית">
<meta property="og:description" content="מורה פרטי קולי בעברית: שיעורים, אוצר מילים, אתגר יומי, טבלאות שיאים — וגם מצב נהיגה לתרגול בדרך. חינם לגמרי.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#101418">
<title>LinguaDrive — לומדים אנגלית וספרדית</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LinguaDrive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@300;400;500;700&family=Overpass:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101418;            /* אספלט לילה */
  --bg2:#0B0F12;
  --surface:#1A2128;       /* אספלט רטוב */
  --surface2:#222B34;
  --line:#2E3942;
  --sign:#17714B;          /* ירוק שלט דרכים */
  --sign-deep:#0F5C3C;
  --lane:#FFC93C;          /* צהוב סימון נתיב */
  --lane-soft:rgba(255,201,60,.14);
  --ink:#F2F5F4;           /* לבן שלט */
  --muted:#93A1AC;
  --danger:#E4573D;
  --ok:#4CC38A;
  --r:18px;
  --hebrew:'Heebo',system-ui,sans-serif;
  --display:'Secular One',var(--hebrew);
  --road:'Overpass','Heebo',system-ui,sans-serif; /* פונט שלטי כביש לאנגלית */
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{
  font-family:var(--hebrew);
  background:var(--bg);
  color:var(--ink);
  line-height:1.65;
  min-height:100dvh;
  overscroll-behavior-y:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;font-size:1rem}
[dir="ltr"],.en{font-family:var(--road);direction:ltr}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:.01em}
.hide{display:none!important}

/* ===== מבנה ===== */
#topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:.6rem;
  padding:calc(env(safe-area-inset-top,0px) + .7rem) 1rem .7rem;
  background:linear-gradient(180deg,rgba(16,20,24,.97),rgba(16,20,24,.88));
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
#topbar .logo{display:flex;align-items:center;gap:.55rem}
#topbar .logo .plate{
  font-family:var(--road);font-weight:800;font-size:.8rem;letter-spacing:.06em;
  background:var(--sign);border:2px solid var(--ink);border-radius:8px;
  padding:.14rem .5rem;direction:ltr;
}
#topbar .logo .t{font-family:var(--display);font-size:1.05rem}
#topbar .spacer{flex:1}
#streakChip{
  display:flex;align-items:center;gap:.3rem;font-weight:700;font-size:.92rem;
  background:var(--lane-soft);color:var(--lane);
  border:1px solid rgba(255,201,60,.35);border-radius:99px;padding:.2rem .7rem;
}
#view{padding:1rem 1rem calc(6.2rem + var(--safe-b));max-width:640px;margin:0 auto}

#bottomnav{
  position:fixed;inset-inline:0;bottom:0;z-index:30;
  display:flex;justify-content:space-around;
  background:rgba(11,15,18,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:.45rem .3rem calc(.45rem + var(--safe-b));
}
#bottomnav button{
  display:flex;flex-direction:column;align-items:center;gap:.15rem;
  color:var(--muted);font-size:.72rem;font-weight:500;
  padding:.3rem .6rem;border-radius:12px;min-width:60px;
}
#bottomnav button .ic{font-size:1.35rem;line-height:1}
#bottomnav button.active{color:var(--lane)}
#bottomnav button.active .ic{transform:translateY(-1px)}
#bottomnav .navbadge{
  position:absolute;transform:translate(-14px,-4px);
  background:var(--danger);color:#fff;font-size:.62rem;font-weight:700;
  min-width:17px;height:17px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;
}

/* ===== קלפים ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem;margin-bottom:1rem}
.card h2{font-size:1.15rem;margin-bottom:.5rem}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:.35rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* שלט דרכים ירוק — חתימת העיצוב */
.signcard{
  background:linear-gradient(160deg,var(--sign),var(--sign-deep));
  border-radius:var(--r);
  padding:1.15rem 1.15rem 1rem;
  position:relative;margin-bottom:1rem;
  box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 0 0 2px rgba(242,245,244,.85), inset 0 0 0 6px var(--sign-deep);
}
.signcard .en-line{
  font-family:var(--road);font-weight:700;font-size:1.5rem;line-height:1.3;
  direction:ltr;text-align:left;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.3);
}
.signcard .he-line{margin-top:.45rem;color:rgba(242,245,244,.92);font-size:1.02rem}
.signcard .sign-tools{display:flex;gap:.5rem;margin-top:.9rem}

/* נתיב התקדמות — קווים צהובים מקווקווים */
.lane-progress{display:flex;gap:6px;margin:.6rem 0 .2rem}
.lane-progress i{flex:1;height:7px;border-radius:4px;background:var(--surface2)}
.lane-progress i.on{background:var(--lane);box-shadow:0 0 10px rgba(255,201,60,.4)}

/* כפתורים */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  font-weight:700;font-size:1rem;border-radius:14px;
  padding:.8rem 1.3rem;border:1px solid var(--line);background:var(--surface2);
  transition:transform .08s ease,filter .15s;
  touch-action:manipulation;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--lane);color:#191919;border-color:var(--lane)}
.btn.ghost{background:transparent}
.btn.big{width:100%;padding:1.05rem;font-size:1.12rem}
.btn.round{width:56px;height:56px;border-radius:50%;padding:0;font-size:1.4rem;flex:none}
.btn.danger{color:var(--danger);border-color:rgba(228,87,61,.4)}
.btn:disabled{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:.6rem;flex-wrap:wrap}
.btnrow .btn{flex:1}

/* רשימת שיעורים */
.unit-h{display:flex;align-items:center;gap:.5rem;margin:1.4rem 0 .6rem;font-family:var(--display);font-size:1.05rem;color:var(--lane)}
.lesson-item{
  display:flex;align-items:center;gap:.85rem;width:100%;text-align:start;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:.9rem 1rem;margin-bottom:.6rem;
}
.lesson-item .lic{font-size:1.5rem;flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border-radius:12px}
.lesson-item .lt{flex:1;min-width:0}
.lesson-item .lt .he{font-weight:700}
.lesson-item .lt .en{font-size:.8rem;color:var(--muted);direction:ltr;text-align:right}
.lesson-item .done{color:var(--ok);font-size:1.2rem}
.lesson-item.locked{opacity:.9}

/* טאבים בתוך שיעור */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:1rem;overflow-x:auto}
.seg button{flex:1;padding:.55rem .6rem;border-radius:10px;font-weight:700;font-size:.88rem;color:var(--muted);white-space:nowrap}
.seg button.active{background:var(--surface2);color:var(--ink)}
.seg button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-inline-start:4px;vertical-align:middle}

/* אוצר מילים */
.vrow{display:flex;align-items:center;gap:.7rem;padding:.7rem .2rem;border-bottom:1px dashed var(--line)}
.vrow:last-child{border-bottom:none}
.vrow .ven{font-family:var(--road);font-weight:700;font-size:1.12rem;direction:ltr;min-width:0}
.vrow .vt{font-size:.8rem;color:var(--lane)}
.vrow .vhe{color:var(--muted);font-size:.95rem}
.vrow .grow{flex:1;min-width:0}
.playbtn{width:44px;height:44px;flex:none;border-radius:50%;background:var(--surface2);border:1px solid var(--line);font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.playbtn.playing{background:var(--lane);color:#191919;border-color:var(--lane)}

/* דקדוק */
.gblock{margin-bottom:1.1rem}
.gblock h3{font-size:1.02rem;color:var(--lane);margin-bottom:.3rem;font-weight:700}
.gex{display:flex;align-items:center;gap:.6rem;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:.55rem .7rem;margin-top:.5rem}
.gex .en{font-weight:600;font-size:1rem;flex:1;text-align:left}
.gex .he{color:var(--muted);font-size:.85rem}

/* תרגול הגייה */
.micstage{display:flex;flex-direction:column;align-items:center;gap:.8rem;padding:.6rem 0}
.micbtn{
  width:88px;height:88px;border-radius:50%;font-size:2rem;
  background:var(--surface2);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.micbtn.listening{background:var(--danger);border-color:var(--danger);color:#fff}
.micbtn.listening::after{
  content:"";position:absolute;inset:-10px;border-radius:50%;
  border:2px solid var(--danger);animation:pulse 1.2s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.scorebox{width:100%;text-align:center}
.scorenum{font-family:var(--road);font-weight:800;font-size:2.3rem;direction:ltr}
.scorenum.great{color:var(--ok)}.scorenum.ok{color:var(--lane)}.scorenum.retry{color:var(--danger)}
.words{direction:ltr;display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;margin-top:.5rem}
.words span{font-family:var(--road);font-weight:600;padding:.2rem .55rem;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
.words span.ok{background:rgba(76,195,138,.15);border-color:rgba(76,195,138,.5);color:var(--ok)}
.words span.bad{background:rgba(228,87,61,.13);border-color:rgba(228,87,61,.5);color:#F0907E}
.heardline{margin-top:.4rem;font-size:.85rem;color:var(--muted);direction:ltr}

/* חידון */
.qopt{display:block;width:100%;text-align:start;background:var(--surface2);border:1px solid var(--line);
  border-radius:14px;padding:.85rem 1rem;margin-bottom:.6rem;font-size:1.02rem;font-weight:500}
.qopt.en{direction:ltr;text-align:left;font-family:var(--road)}
.qopt.right{background:rgba(76,195,138,.18);border-color:var(--ok)}
.qopt.wrong{background:rgba(228,87,61,.15);border-color:var(--danger)}
.qexplain{background:var(--bg2);border-inline-start:3px solid var(--lane);border-radius:10px;padding:.6rem .8rem;margin:.4rem 0 .8rem;font-size:.92rem}

/* פלאשקארד */
.flash{perspective:1200px;margin-bottom:1rem}
.flash .inner{position:relative;transition:transform .45s;transform-style:preserve-3d;min-height:240px}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;
  border-radius:var(--r);padding:1.2rem;text-align:center}
.flash .front{background:var(--surface);border:1px solid var(--line)}
.flash .back{background:linear-gradient(160deg,var(--sign),var(--sign-deep));transform:rotateY(180deg);
  box-shadow:inset 0 0 0 2px rgba(242,245,244,.85), inset 0 0 0 6px var(--sign-deep)}
.flash .bigword{font-size:1.7rem;font-weight:700}
.flash .back .bigword{font-family:var(--road);direction:ltr;color:#fff}

/* מצב נהיגה */
#carScreen{
  position:fixed;inset:0;z-index:60;background:var(--bg2);
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + .8rem) 1rem calc(1rem + var(--safe-b));
}
#carScreen .car-top{display:flex;align-items:center;gap:.6rem}
#carScreen .car-top .ttl{font-family:var(--display);font-size:1.05rem;flex:1}
#carMain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;min-height:0}
#carPrompt{font-size:1.5rem;font-weight:700;max-width:100%;overflow-wrap:break-word}
#carPrompt .en{font-family:var(--road);direction:ltr;display:block;font-size:2rem;line-height:1.25}
#carState{font-size:1rem;color:var(--muted);min-height:1.5em}
#carState.listening{color:var(--danger);font-weight:700}
#carScore{font-family:var(--road);font-weight:800;font-size:2.6rem;direction:ltr;min-height:1em}
#carTap{
  flex:none;width:100%;border-radius:24px;padding:1.4rem;
  background:var(--lane);color:#191919;font-size:1.5rem;font-weight:800;
  box-shadow:0 8px 30px rgba(255,201,60,.25);
}
#carTap.paused{background:var(--surface2);color:var(--ink);border:2px dashed var(--lane)}
.car-sub{display:flex;gap:.6rem;margin-top:.7rem}
.car-sub .btn{flex:1;padding:1rem;font-size:1.05rem}
#carLane{display:flex;gap:5px;margin-top:.8rem}
#carLane i{flex:1;height:6px;border-radius:3px;background:var(--surface2)}
#carLane i.on{background:var(--lane)}

/* מודאל / הדרכה */
#overlay{position:fixed;inset:0;z-index:80;background:rgba(5,8,10,.75);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center}
#overlay .sheet{background:var(--surface);border:1px solid var(--line);border-bottom:none;
  border-radius:24px 24px 0 0;padding:1.4rem 1.2rem calc(1.4rem + var(--safe-b));width:100%;max-width:640px;max-height:88dvh;overflow-y:auto}
#overlay .sheet h2{font-size:1.3rem;margin-bottom:.6rem}

/* טוסט */
#toast{position:fixed;bottom:calc(6.5rem + var(--safe-b));inset-inline:0;display:flex;justify-content:center;z-index:90;pointer-events:none}
#toast .t{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:.6rem 1.1rem;
  font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:all .25s}
#toast .t.show{opacity:1;transform:translateY(0)}

/* סטטיסטיקה */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.8rem .5rem;text-align:center}
.stat .n{font-family:var(--road);font-weight:800;font-size:1.5rem;direction:ltr;color:var(--lane)}
.stat .l{font-size:.75rem;color:var(--muted)}
.weekbars{display:flex;align-items:flex-end;gap:.5rem;height:110px;padding:.4rem .2rem 0}
.weekbars .wb{flex:1;display:flex;flex-direction:column;align-items:center;gap:.3rem;height:100%;justify-content:flex-end}
.weekbars .bar{width:100%;max-width:34px;border-radius:6px 6px 0 0;background:var(--surface2);min-height:4px}
.weekbars .bar.on{background:var(--lane)}
.weekbars .wl{font-size:.68rem;color:var(--muted)}

/* הגדרות */
.setrow{display:flex;align-items:center;gap:.8rem;padding:.75rem 0;border-bottom:1px dashed var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .sl{flex:1}
.setrow .sl .d{font-size:.8rem;color:var(--muted)}
.setrow select,.setrow input[type=range]{max-width:46%}
select{background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.45rem .6rem}
input[type=text],input[type=email],input[type=password],input[type=search]{
  width:100%;background:var(--surface2);color:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:.75rem .9rem;margin:.25rem 0;font-size:1rem}
input[type=text]:focus,input[type=email]:focus,input[type=password]:focus,input[type=search]:focus{
  outline:none;border-color:var(--lane)}
.formerr{color:var(--danger);font-size:.85rem;min-height:1.2em;margin-top:.3rem}
.lb-row{display:flex;align-items:center;gap:.7rem;padding:.55rem .2rem;border-bottom:1px dashed var(--line)}
.lb-row:last-child{border-bottom:none}
.lb-row .rank{font-family:var(--road);font-weight:800;width:2rem;text-align:center;direction:ltr;color:var(--muted)}
.lb-row.me{background:var(--lane-soft);border-radius:10px;padding-inline:.5rem}
.lb-row .score{font-family:var(--road);font-weight:800;direction:ltr;color:var(--lane)}
.wordstatus{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.wordstatus.tracked{background:var(--lane)}
.wordstatus.mastered{background:var(--ok)}
input[type=range]{accent-color:var(--lane);width:140px}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .sldr{position:absolute;inset:0;background:var(--surface2);border:1px solid var(--line);border-radius:99px;transition:.2s}
.switch .sldr::before{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--muted);top:3px;inset-inline-start:4px;transition:.2s}
.switch input:checked + .sldr{background:var(--sign);border-color:var(--sign)}
.switch input:checked + .sldr::before{transform:translateX(-20px);background:#fff}
html[dir="ltr"] .switch input:checked + .sldr::before{transform:translateX(20px)}

.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:.4rem .9rem;font-weight:600;font-size:.9rem}
.chip.on{background:var(--lane-soft);border-color:rgba(255,201,60,.5);color:var(--lane)}

.empty{ text-align:center;color:var(--muted);padding:2rem 1rem}
.empty .e{font-size:2.4rem;margin-bottom:.5rem}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media (min-width:700px){ html{font-size:18px} }

/* --- Journey map --- */
.mapwrap{position:relative;margin:.4rem 0 1rem}
.mapsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mapnode{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1.45rem;z-index:2;padding:0;cursor:pointer;
  background:var(--card);border:3px solid var(--line);color:var(--ink);transition:transform .15s}
.mapnode:active{transform:translate(-50%,-50%) scale(.93)}
.mapnode.done{background:var(--sign);border-color:var(--signline)}
.mapnode.cur{border-color:var(--lane);box-shadow:0 0 0 4px rgba(255,209,102,.22);animation:curpulse 1.6s infinite}
.mapnode.lock{opacity:.45;filter:grayscale(.6)}
.mapnode.bossnode{border-radius:16px;border-style:dashed}
.mapnode .st{position:absolute;bottom:-4px;left:-4px;font-size:.8rem;background:var(--bg);border-radius:50%;line-height:1}
.maplabel{position:absolute;transform:translate(-50%,0);top:34px;width:96px;text-align:center;font-size:.62rem;color:var(--muted);
  line-height:1.2;pointer-events:none;z-index:2}
.mapvehicle{position:absolute;transform:translate(-50%,-140%);font-size:1.6rem;z-index:3;pointer-events:none;
  animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.unitsign{position:absolute;left:50%;transform:translateX(-50%);z-index:2;background:var(--sign);
  border:2px solid var(--signline);border-radius:10px;padding:.3rem .9rem;font-weight:700;font-size:.85rem;white-space:nowrap}
@keyframes curpulse{0%,100%{box-shadow:0 0 0 4px rgba(255,209,102,.22)}50%{box-shadow:0 0 0 9px rgba(255,209,102,.08)}}
@keyframes bob{0%,100%{transform:translate(-50%,-140%)}50%{transform:translate(-50%,-165%)}}
/* --- Confetti --- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden}
.confetti span{position:absolute;top:-8%;animation:cfall 2.2s ease-in forwards}
@keyframes cfall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(340deg);opacity:.15}}
/* --- Garage --- */
.garage{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
.gcar{aspect-ratio:1;border-radius:14px;background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.15rem;font-size:1.7rem;cursor:pointer;padding:0;color:var(--ink)}
.gcar small{font-size:.55rem;color:var(--muted)}
.gcar.sel{border-color:var(--lane);background:rgba(255,209,102,.08)}
.gcar.lock{opacity:.4;filter:grayscale(.7)}
/* --- Daily grid --- */
.dgrid{display:flex;gap:.25rem;justify-content:center;font-size:1.3rem;letter-spacing:.05em;direction:ltr}

</style>
</head>
<body>

<header id="topbar">
  <div class="logo"><span class="plate" id="brandPlate">EN·DRIVE</span><span class="t" id="brandTitle">המורה שלך לאנגלית</span></div>
  <div class="spacer"></div>
  <div id="streakChip" title="ימי תרגול ברצף">🔥 <span id="streakNum">0</span></div>
</header>

<main id="view" aria-live="polite"></main>

<nav id="bottomnav">
  <button data-nav="home"><span class="ic">🏁</span>בית</button>
  <button data-nav="lessons"><span class="ic">📚</span>שיעורים</button>
  <button data-nav="words"><span class="navbadge hide" id="srsBadge">0</span><span class="ic">📖</span>מילים</button>
  <button data-nav="car"><span class="ic">🚗</span>נהיגה</button>
  <button data-nav="more"><span class="ic">⚙️</span>עוד</button>
</nav>

<!-- מצב נהיגה: מסך מלא -->
<section id="carScreen" class="hide" aria-label="מצב נהיגה">
  <div class="car-top">
    <button class="btn round ghost" id="carExit" aria-label="יציאה">✕</button>
    <div class="ttl">🚗 מצב נהיגה</div>
    <div class="muted small" id="carClock"></div>
  </div>
  <div id="carMain">
    <div id="carPrompt"></div>
    <div id="carState"></div>
    <div id="carScore"></div>
  </div>
  <div id="carLane"></div>
  <button id="carTap">▶ התחל</button>
  <div class="car-sub">
    <button class="btn" id="carRepeat">🔁 שוב</button>
    <button class="btn" id="carSlow">🐢 לאט</button>
    <button class="btn" id="carSkip">⏭ דלג</button>
  </div>
</section>

<div id="overlay" class="hide"><div class="sheet" id="sheet"></div></div>
<div id="toast"><div class="t" id="toastT"></div></div>

<script src="logic.js"></script>
<script src="merge.js"></script>
<script src="content.js"></script>
<script src="content-es.js"></script>
<script src="content-bank.js"></script>
<script src="content-bank-es.js"></script>
<script src="audio-manifest.js"></script>
<script src="cloud-config.js"></script>
<script src="backend.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
<script src="voice.js"></script>
<script src="answers.js"></script>
<script src="vocab.js"></script>
<script src="account.js"></script>
</body>
</html>
